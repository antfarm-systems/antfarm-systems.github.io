# ----------- CONFIGURABLE START -----------
title:            "AntFarm Systems"
description:      "This is an opinion site."
url:              https://antfarm.systems # Site url, without a slash at the end.
signoff:          "The AntFarm" # Fallback byline; per-post bylines live in _data/authors.yml
photo_credit:     "Luis E. Cerezo" # Copyright line on photos with `exif: true`; override per photo with `credit:`
google_analytics: G-DMG7WF4SSG # Set tracking, remove the gtag block in /_includes/head.html if unwanted.

links:
  - name:         Posts
    url:          /
    external:     false
  - name:         Best of
    url:          /best-of/
    external:     false
  - name:         Collections
    url:          /collections/
    external:     false
  - name:         Inktober
    url:          /inktober/
    external:     false
  - name:         About The AntFarm
    url:          /about
    external:     false
# ------------ CONFIGURABLE END ------------

permalink:        /posts/:title

# The ink drawings are a collection, not posts, so they stay out of `site.posts`
# entirely — the front page, feed.xml, best-of, collections and the prev/next
# arrows all skip them without needing a filter. `:path` is the file's path
# inside _inktober/, so the year directory ends up in the URL:
#   _inktober/2026/04-cactus.md  ->  /inktober/2026/04-cactus
collections:
  inktober:
    output: true
    permalink: /inktober/:path

defaults:
  - values:
      layout: "default"
      author: "antfarm" # Byline key from _data/authors.yml. Use "luis" for posts you wrote.
  - scope:
      type: "inktober"
    values:
      layout: "inktober" # wraps default.html and prints the day/prompt line + photo
      author: "luis"     # they're all his hand

include:
  - "*.txt"
exclude:
  - "vendor"
  - "CNAME"
  - "Gemfile*"
  - "README*"
  - "CLAUDE.md" # repo instructions, not site content

plugins:
  - jekyll-sitemap
  - jemoji

whitelist:
  - jekyll-sitemap
  - jemoji

