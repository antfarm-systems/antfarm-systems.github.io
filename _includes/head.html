<link href='{{ "/images/fav.png" | relative_url }}' rel='shortcut icon'>
<link href='{{ "/stylesheets/style.css" | relative_url }}' rel='stylesheet' type='text/css' />
<link href='{{ "/stylesheets/syntax.css" | relative_url }}' rel='stylesheet' type='text/css' />
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | absolute_url }}">

<meta content='width=device-width, initial-scale=1.0, user-scalable=no' name='viewport'>
<meta content='text/html; charset=utf-8' http-equiv='content-type' />
{% if page.date %}
  {% assign description = page.excerpt | default: page.content | strip_html | strip_newlines | truncate: 160 %}
  <meta name="description" content="{{ description }}" />
  <meta content='{{ page.url | absolute_url }}' property='og:url' />
  <meta content="{{ description }}" property='og:description' />
  <meta content="article" property="og:type" />
  <meta content="{{ page.image | default: '/images/ant.png' | absolute_url }}" property="og:image" />
  <meta content="400" property="og:image:width" />
  <meta content="400" property="og:image:height" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ page.title }}" />
  <meta name="twitter:description" content="{{ description }}" />
  <meta name="twitter:image" content="{{ page.image | default: '/images/ant.png' | absolute_url }}" />
{% else %}
  <meta name="description" content="{{ site.description }}" />
  <meta content='{{ "/" | absolute_url }}' property='og:url' />
  <meta content="{{ site.description }}" property='og:description' />
  <meta content="blog" property="og:type" />
  <meta content="{{ "/images/ant.png" | absolute_url }}" property="og:image" />
  <meta content="400" property="og:image:width" />
  <meta content="400" property="og:image:height" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ site.title }}" />
  <meta name="twitter:description" content="{{ site.description }}" />
  <meta name="twitter:image" content="{{ "/images/ant.png" | absolute_url }}" />
{% endif %}
<!-- - -->

{% if site.google_analytics %}
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
